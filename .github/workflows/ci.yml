name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm test -- --run

      - name: Build
        working-directory: web
        run: npm run build

      # The Go binary embeds web/dist via //go:embed, so share it with the go job.
      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  go:
    name: Go (fmt · vet · build · test)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # go build / vet / test all compile static.go, whose //go:embed all:web/dist
      # fails unless the frontend build output is present.
      - name: Download web build
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: web/dist

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi

      - name: Verify modules
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -o workload-analyzer .

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./...
